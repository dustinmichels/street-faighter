[tools]
"npm:oxfmt" = "latest"
"github:GDQuest/GDScript-formatter" = { version = "latest", bin = "gdscript-formatter" }
# The release zip drops the executable bit.
"github:itchio/butler" = { version = "latest", postinstall = "chmod +x \"$MISE_TOOL_INSTALL_PATH/butler\"" }

[env]
ITCH_TARGET = "dustinmichels/street-faighter"

[tasks.fmt]
description = "Format GDScript with gdscript-formatter and everything else with oxfmt"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
set -u
status=0
gdscript-formatter --exclude .godot --exclude build . || status=$?
echo
oxfmt . || status=$?
exit $status
"""

# ----- Setup -----
[tasks.setup]
description = "Prompt for your itch.io API key and save it to mise.local.toml (git-ignored)"
dir = "{{config_root}}"
raw = true
file = "scripts/setup.sh"

# ----- Dev -----
[tasks.dev]
description = "Run the game with Godot"
dir = "{{config_root}}"
run = "godot --path ."

[tasks.multiplayer]
description = "Launch two connected instances side by side (host + join on 127.0.0.1:7777)"
alias = "mp"
dir = "{{config_root}}"
file = "scripts/multiplayer.sh"

# ----- Docs -----
[tasks.docs]
description = "Preview the documentation site (VitePress) with hot reload"
dir = "{{config_root}}/docs"
run = "npm install && npm run dev"

[tasks.docs-build]
description = "Build the documentation site into docs/.vitepress/dist"
dir = "{{config_root}}/docs"
run = "npm ci && npm run build"

# ----- Export / Release -----
[tasks.export]
description = "Export macOS, Windows and Linux builds into build/release/*.zip"
dir = "{{config_root}}"
file = "scripts/export.sh"

[tasks.itch]
description = "Push the builds from `mise run export` to itch.io (channels mac, windows, linux)"
dir = "{{config_root}}"
file = "scripts/itch.sh"

[tasks.release]
description = "Export all platforms, tag HEAD with the next version, push the tag, publish a GitHub release and push to itch.io"
dir = "{{config_root}}"
file = "scripts/release.sh"
